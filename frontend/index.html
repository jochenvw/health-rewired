<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oncology Hackathon 2026 Munich – the starting canvas for agentic oncology ideas." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎗️</text></svg>" />
    <title>Oncology Hackathon 2026 · Munich</title>
  </head>
  <body>
    <script>
      // Apply the persisted (or system-preferred) theme before paint, so idea pages never flash the
      // wrong theme. The Light / Dark buttons in HospitalShell keep this attribute in sync afterwards.
      (function () {
        try {
          var stored = localStorage.getItem('hx-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
