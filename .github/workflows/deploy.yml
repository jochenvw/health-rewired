name: Deploy

# main  -> revision labelled "main" with 100 % traffic  (https://<app>.<env-domain>)
# PR    -> revision labelled "pr-<N>" with 0 % traffic  (https://<app>---pr-<N>.<env-domain>)
on:
  push:
    branches: [main]
  pull_request:
    # `edited` catches the Copilot coding agent dropping "[WIP]" from the title when it finishes.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: oncology-hackathon

jobs:
  ci:
    # Body-only edits need neither CI nor a deploy.
    if: github.event.action != 'edited' || github.event.changes.title != null
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure Container Apps
    needs: ci
    # No Azure credentials for forks or Dependabot; they get CI only.
    # "[WIP]" PRs are still being written by the Copilot coding agent; deploy once it renames them.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]' &&
       !startsWith(github.event.pull_request.title, '[WIP]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - name: Tell participant the prototype is being published
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const marker = "<!-- oncology-hackathon-preview -->";
            const releaseRe = /<!-- oncology-hackathon-release:/;
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:5){nodes{number}}}}}`,
              { owner, repo, pr },
            );

            for (const { number: issue_number } of repository.pullRequest.closingIssuesReferences.nodes) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const status = comments.find(
                (comment) => comment.body?.includes(marker) && !releaseRe.test(comment.body),
              );
              if (!status) continue;

              const body = [
                marker,
                `### ✅ Prototype built · publishing your preview`,
                ``,
                `Copilot has finished the first version. We are running the final checks and publishing it now.`,
                `The live link should appear here in a few more minutes.`,
              ].join("\n");
              await github.rest.issues.updateComment({
                owner, repo, comment_id: status.id, body,
              });
            }

      - name: Check configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ACA_APP_NAME: ${{ vars.ACA_APP_NAME }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          if [[ -z "$AZURE_CLIENT_ID" || -z "$ACA_APP_NAME" || -z "$ACR_NAME" ]]; then
            echo "::error::Azure is not configured. Run scripts/bootstrap-azure.sh and scripts/bootstrap-github.sh (see docs/organizers.md)."
            exit 1
          fi

      - name: Compute names
        id: names
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short="${SHA:0:7}"
          if [[ -n "$PR" ]]; then
            label="pr-$PR"; suffix="pr$PR-$short-r$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"; tag="pr-$PR-$short"; min=0
          else
            label="main"; suffix="main-$short-r$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"; tag="main-$short"; min=1
          fi
          {
            echo "label=$label"
            echo "suffix=$suffix"
            echo "tag=$tag"
            echo "min=$min"
            echo "version=$short"
          } >>"$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        id: acr
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          echo "server=$(az acr show --name '${{ vars.ACR_NAME }}' --query loginServer -o tsv)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.names.outputs.tag }}
          build-args: APP_VERSION=${{ steps.names.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy revision
        id: deploy
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACA_APP_NAME: ${{ vars.ACA_APP_NAME }}
          IMAGE: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.names.outputs.tag }}
          LABEL: ${{ steps.names.outputs.label }}
          REVISION_SUFFIX: ${{ steps.names.outputs.suffix }}
          APP_VERSION: ${{ steps.names.outputs.version }}
          MIN_REPLICAS: ${{ steps.names.outputs.min }}
        run: bash scripts/aca-deploy.sh

      - name: Verify
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            status=$(curl -fsS --max-time 20 "$URL/api/status" || true)
            if grep -q "\"version\":\"$VERSION\"" <<<"$status"; then
              echo "Live: $URL"; echo "$status"
              echo "### 🚀 Live at $URL" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for $URL ($i)…"; sleep 10
          done
          echo "::error::$URL did not serve version $VERSION"; exit 1

      - name: Share preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.names.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const url = process.env.URL;
            const marker = "<!-- oncology-hackathon-preview -->";

            async function upsert(issue_number, body) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find((c) => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:5){nodes{number}}}}}`,
              { owner, repo, pr },
            );
            const issues = repository.pullRequest.closingIssuesReferences.nodes.map((n) => n.number);

            // Every new build that goes live is a new prototype version on the idea issue:
            // v1.0, v1.1, v1.2, … The hidden marker stores version and build, so re-runs of the
            // same build do not post again and the next number is derived from the issue itself.
            const releaseRe = /<!-- oncology-hackathon-release: v1\.(\d+) build: (\w+) -->/;
            const build = process.env.VERSION;
            let latest = null;

            for (const issue_number of issues) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const releases = comments
                .map((c) => c.body?.match(releaseRe))
                .filter(Boolean)
                .map((m) => ({ minor: Number(m[1]), build: m[2] }));
              const already = releases.find((r) => r.build === build);
              const minor = already ? already.minor : releases.reduce((max, r) => Math.max(max, r.minor + 1), 0);
              latest = `v1.${minor}`;
              if (already) continue;

              const body = [
                ...(minor === 0 ? [marker] : []),
                `<!-- oncology-hackathon-release: ${latest} build: ${build} -->`,
                minor === 0 ? `### 🚀 Your prototype is live · ${latest}` : `### 🆕 New version live · ${latest}`,
                ``,
                `**${url}/#/idea/${issue_number}**`,
                ``,
                minor === 0
                  ? `Try it and reply on this issue with the most important change. We can make up to two quick revision rounds. When it shows the idea well enough, reply \`/architecture\` to start the future Azure architecture coach.`
                  : `Copilot has updated your prototype. Reload the page, then reply here if another focused revision is needed (maximum two rounds). When you are done, reply \`/architecture\`.`,
                `Synthetic data only · hackathon prototype · not for clinical use.`,
              ].join("\n");

              // The first version replaces the "🛠️ Building your prototype" status comment.
              const status = comments.find((c) => c.body?.includes(marker) && !releaseRe.test(c.body));
              if (minor === 0 && status) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: status.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["preview-ready"] });
            }

            await upsert(pr, [
              marker,
              `### 🚀 Preview ready${latest ? ` · ${latest}` : ""}`,
              ``,
              `**${url}${issues.length ? `/#/idea/${issues[0]}` : ""}**`,
              ``,
              `Build \`${build}\` · updates automatically on every push to this pull request.`,
              `Synthetic data only · hackathon prototype · not for clinical use.`,
            ].join("\n"));

      - name: Tell participant if publishing failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request.number;
            const marker = "<!-- oncology-hackathon-preview -->";
            const releaseRe = /<!-- oncology-hackathon-release:/;
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:5){nodes{number}}}}}`,
              { owner, repo, pr },
            );

            for (const { number: issue_number } of repository.pullRequest.closingIssuesReferences.nodes) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const status = comments.find(
                (comment) => comment.body?.includes(marker) && !releaseRe.test(comment.body),
              );
              const body = [
                marker,
                `### ⚠️ We could not publish the prototype yet`,
                ``,
                `The first version was built, but the live preview hit a problem during final checks.`,
                `An organiser can see the failure and will take a look. Your idea and feedback are safe here.`,
              ].join("\n");

              if (status) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: status.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number, body,
                });
              }
            }
