name: Deploy Health Rewired

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_SUBSCRIPTION_ID: e3825c9a-4bce-43e1-899e-1610156c9383

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Set Azure subscription
        shell: bash
        run: |
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Register Azure Container Apps provider
        shell: bash
        run: |
          az provider register --namespace Microsoft.App --wait

      - name: Ensure Container Apps environment is ready
        shell: bash
        env:
          PYTHONUTF8: "1"
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          az extension add --name containerapp --upgrade --allow-preview true
          for i in {1..30}; do
            state=$(az containerapp env show \
              --name healthrewired-env \
              --resource-group rg-health-rewired-munich \
              --query properties.provisioningState \
              -o tsv 2>/dev/null || echo "NotFound")
            echo "Environment state: $state"
            if [ "$state" = "Succeeded" ] || [ "$state" = "Running" ] || [ "$state" = "NotFound" ]; then
              break
            fi
            sleep 30
          done

      - name: Deploy to Azure Container Apps
        shell: bash
        env:
          PYTHONUTF8: "1"
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          az containerapp up \
            --name healthrewired-munich \
            --resource-group rg-health-rewired-munich \
            --location westeurope \
            --environment healthrewired-env \
            --ingress external \
            --target-port 8000 \
            --source .

      - name: Show app endpoint
        shell: bash
        run: |
          az containerapp show \
            --name healthrewired-munich \
            --resource-group rg-health-rewired-munich \
            --query properties.configuration.ingress.fqdn \
            -o tsv
