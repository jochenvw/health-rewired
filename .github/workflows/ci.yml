name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          cd backend && uv sync --frozen && cd ..
          npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          COPILOT_USE_LOGGED_IN_USER: "false"
        run: npm test

      - name: Build frontend
        run: npm run build
