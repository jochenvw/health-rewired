name: Build started

# Tells the participant as soon as the Copilot coding agent is assigned. Triggered by the assignment
# (not by Copilot's PR), so it does not wait for workflow approval. Uses the same marker as the
# preview comment in deploy.yml, which later replaces this message with the live link.
on:
  issues:
    types: [assigned]

permissions:
  issues: write

jobs:
  announce:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.assignee.login == 'Copilot' || github.event.assignee.login == 'copilot-swe-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const marker = "<!-- oncology-hackathon-preview -->";
            const body = [
              marker,
              `### 🛠️ Building your prototype`,
              ``,
              `GitHub Copilot has started implementing the proposal above. This usually takes 10–20 minutes.`,
              `We will update this message when the first version is built, checked and published.`,
              `The link to your live prototype will appear right here when it is ready.`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
