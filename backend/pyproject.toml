[project]
name = "oncology-hackathon"
version = "0.1.0"
description = "Starter app for the Health Rewired Munich 2026 Hackathon"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "github-copilot-sdk>=0.0.1",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
